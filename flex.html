<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms</title>
</head>
<body>
    <form>
        <fieldset>
        <legend style="text-align: center;">Sign in</legend>


<label>Full Name</label> <br><br>
<input type="text" placeholder="Enter your name"><br><br>
<label>Email</label> <br>
<input type="email" placeholder="Enter your email"><br><br>
<label>Password</label>
<input type="password" placeholder="Enter your password"><br><br>

<label>DOB</label> <br>
<input type="date"><br><br>
<label>Gender</label> <br>
<input type="radio" name="gender">Male
<input type="radio" name="gender">Female
<br><br>
   <label>Courses</label><br>
   <input type="checkbox">HTML
   <input type="checkbox">JAVASCRIPT
   <input type="checkbox">CSS 

<label>Why do you want to register?</label>
<select name="reason" id="course">
    <option selected disabled>Pick an option</option>
    <option>I want to learn</option>
    <option>I want to upskill</option>
    <option>I want to earn</option>
</select>
<label>Feedback</label>
<textarea rows="4" cols="30" placeholder="Enter your feedback">
</textarea>
<br><br>

<label>File Upload</label>
<input type="file"><br><br>
<button type="submit">Send a message</button>
    </form>
</body>
</html>
